# Continuous deployment to staging (never production). Every push to stg, or a manual run from
# stg: the ci checks, then the out/ they built with .env.staging goes live on the staging
# Firebase Hosting site, and the site is checked to serve this commit. Setup, rollback and
# troubleshooting: docs/staging.md.
name: deploy-staging

on:
  push:
    branches: [stg] # main is kept for production
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash # explicit: adds pipefail

# One deploy at a time: a newer push waits, and replaces any deploy that is still waiting.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-build: true

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub holds no Google key
    env:
      # Repository variables (Settings → Secrets and variables → Actions → Variables).
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
      # The staging Hosting site, in PROJECT_ID (docs/staging.md, step 1). firebase.json keeps
      # production's site; the deploy uses a copy of it that names this one.
      SITE: switchfood-staging-ops
      FIREBASE_TOOLS_VERSION: 15.29.0
    steps:
      - name: Check the branch and the repository variables
        run: |
          if [ "$GITHUB_REF" != refs/heads/stg ]; then
            echo "::error::Staging deploys only from stg (this run is on $GITHUB_REF). Google refuses any other branch."
            exit 1
          fi
          missing=""
          [ -n "$PROJECT_ID" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WIF_PROVIDER"
          [ -n "$DEPLOY_SA" ] || missing="$missing GCP_DEPLOY_SA"
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables:$missing (docs/staging.md, step 3)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Get the build ci tested
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: out
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Preflight (the staging server answers, the staging site config)
        id: preflight
        run: |
          server=$(sed -n 's/^NEXT_PUBLIC_PARSE_SERVER_URL=//p' .env.staging)
          echo "server_url=$server" >> "$GITHUB_OUTPUT"
          # App Engine scales staging to zero when idle: a cold start takes up to a minute.
          ok=""
          for _ in $(seq 12); do
            if curl -s --max-time 20 "$server/health" | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            echo "the staging server isn't answering yet"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::The staging server $server never answered /health. Check NEXT_PUBLIC_PARSE_SERVER_URL in .env.staging, then switch-server-v2's own staging deploy."
            exit 1
          fi
          jq --arg site "$SITE" '.hosting.site = $site' firebase.json > firebase.staging.json
          # What's live, for people and for the smoke test below.
          jq -n --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{commit: $commit, run: $run}' > out/version.json
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Deploy to ${{ env.SITE }}
        run: >
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy --only hosting
          --config firebase.staging.json --project "$PROJECT_ID" --non-interactive
          --message "stg ${GITHUB_SHA::7}, run $GITHUB_RUN_NUMBER"
      - name: Smoke test
        run: |
          url="https://$SITE.web.app"
          ok=""
          for _ in $(seq 12); do
            if curl -s --max-time 10 "$url/version.json" | grep -q "$GITHUB_SHA"; then
              ok=1
              break
            fi
            echo "$url doesn't serve this commit yet"
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::$url never served this commit's version.json. See the deploy step's output."
            exit 1
          fi
          curl -sS --fail --max-time 20 -o /dev/null "$url/login"
          echo "$url serves $GITHUB_SHA"
      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          SERVER_URL: ${{ steps.preflight.outputs.server_url }}
        run: |
          {
            echo "### Staging deploy: $STATUS"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Site | https://$SITE.web.app |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Server | ${SERVER_URL:-n/a} |"
            echo
            echo "Roll back: Firebase console → project \`$PROJECT_ID\` → Hosting → \`$SITE\` → Release history → Roll back."
          } >> "$GITHUB_STEP_SUMMARY"
